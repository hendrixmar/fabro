[package]
name = "fabro-mcp"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
description = "MCP (Model Context Protocol) client for connecting to external tool servers"

[lib]
doctest = false

[lints]
workspace = true

[features]
test-support = []

[dependencies]
anyhow.workspace = true
fabro-config = { path = "../../foundation/fabro-config" }
fabro-http.workspace = true
fabro-types = { path = "../../foundation/fabro-types" }
fabro-sandbox = { path = "../fabro-sandbox", default-features = false }
sandbox-driver.workspace = true
pebble-coding-agent.workspace = true
fabro-util = { path = "../../foundation/fabro-util" }
tokio-util.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
thiserror.workspace = true
rmcp = { workspace = true, features = [
    "client",
    "macros",
    "schemars",
    "server",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }

[dev-dependencies]
fabro-llm = { path = "../fabro-llm", features = ["test-support"] }
fabro-mcp = { path = ".", features = ["test-support"] }
axum.workspace = true
tokio = { workspace = true, features = ["test-util", "macros"] }
tokio-stream.workspace = true
